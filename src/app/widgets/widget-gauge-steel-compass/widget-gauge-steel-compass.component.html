<div class="wrapper" skipResizeObserver (resizeChange)="onResized($event)">
  <div class="compass" [class.stale]="heading() === null" [style.width.px]="side()" [style.height.px]="side()">
    <!-- The case: steelseries' own frame, background and glass, so it is the Classic Steel case and
         not a drawing of one. The library sizes this canvas in CSS pixels at 1:1, which is why both
         layers are laid out to the same square side rather than stretched to the tile. -->
    <canvas #caseCanvas class="case"></canvas>

    <svg
      class="card-layer"
      viewBox="0 0 500 500"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      [attr.aria-label]="displayName() + ' ' + headingText() + ' ' + unitLabel()"
    >
      <defs>
        <linearGradient [attr.id]="gradientId() + '-lcd'" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" [attr.stop-color]="ink().lcdTop" />
          <stop offset="1" [attr.stop-color]="ink().lcdBottom" />
        </linearGradient>
      </defs>

      <!-- The card. It turns against the heading so the number you are steering sits under the index. -->
      <g class="card" [attr.transform]="'rotate(' + cardRotation() + ' 250 250)'">
        @for (tick of cardTicks(); track $index) {
          <line
            [attr.x1]="tick.x1" [attr.y1]="tick.y1" [attr.x2]="tick.x2" [attr.y2]="tick.y2"
            [attr.stroke]="tick.stroke" [attr.stroke-width]="tick.width"
          />
        }
        @for (label of cardLabels(); track $index) {
          <text
            [attr.x]="label.x" [attr.y]="label.y"
            [attr.fill]="label.fill" [attr.font-size]="label.size" [attr.font-weight]="label.weight"
            [attr.transform]="label.rotate"
            text-anchor="middle" dominant-baseline="central"
          >{{ label.text }}</text>
        }
        <circle cx="250" cy="250" r="12" fill="none" [attr.stroke]="ink().symbol" stroke-width="2" />
      </g>

      <!-- Widget name, clear of the card's own printing. -->
      @if (displayName()) {
        <text
          class="face-title"
          x="250" y="196"
          [attr.fill]="ink().symbol"
          text-anchor="middle" dominant-baseline="central"
        >{{ displayName() }}</text>
      }

      <!-- Digital heading, in the library's own LCD tone. -->
      <g class="lcd">
        <rect x="155" y="286" width="190" height="58" rx="4" [attr.fill]="'url(#' + gradientId() + '-lcd)'" />
        <rect x="155" y="286" width="190" height="58" rx="4" fill="none" stroke="rgba(0,0,0,.42)" stroke-width="2" />
        <text class="lcd-unit" x="167" y="316" [attr.fill]="ink().lcdInk" dominant-baseline="central">{{ unitLabel() }}</text>
        <text class="lcd-value" x="333" y="316" [attr.fill]="ink().lcdInk" text-anchor="end" dominant-baseline="central">{{ headingText() }}</text>
      </g>

      <!-- The index: what you read the card against, fixed at the bow. It stays a mark at the rim —
           anything reaching towards the middle of the dial reads as a magnetic needle instead. -->
      <path d="M 250 76 L 262 50 L 238 50 Z" [attr.fill]="ink().index" />
      <line x1="250" y1="74" x2="250" y2="92" [attr.stroke]="ink().index" stroke-width="4" />
    </svg>
  </div>
</div>
