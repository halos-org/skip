<div class="racetimer-wrapper">
  <canvas class="racetimer-canvas" #canvasMainRef></canvas>
  <div class="timerBarContainer">
    <div class="timer-button-groups timer-adjusters-group">
      <button mat-flat-button class="button" (click)="removeTime(5)"><span class="label">-5s</span></button>
      <button mat-flat-button class="button" (click)="removeTime(60)"><span class="label">-60s</span></button>
      <button mat-flat-button class="button main-button" (click)="resetTimer()"><span class="label">Reset</span></button>
      <button mat-flat-button class="button" (click)="addTime(60)"><span class="label">+60s</span></button>
      <button mat-flat-button class="button" (click)="addTime(5)"><span class="label">+5s</span></button>
    </div>
    <div class="timer-button-groups timer-countdown-group">
      @if (!timerRunning()) {
        <button mat-flat-button class="timer-start-button button-color-red" (click)="startTimer()">
          Start
        </button>
      }
      @if (timerRunning()) {
        <button mat-flat-button class="timer-start-button" (click)="pauseTimer()">
          Pause
        </button>
      }
      <button mat-flat-button class="timer-synch-button button-color-red" (click)="roundToMin()">
        Synch
      </button>
    </div>
  </div>
</div>
