<div class="gaugeHeader">
  <span class="gaugeLabel">{{ displayName() }}</span>
  @if (unitSymbol()) {
    <span class="gaugeUnit">{{ unitSymbol() }}</span>
  }
</div>
@if (shouldRenderGauge()) {
  <linear-gauge
    class="linearGauge"
    #linearGauge
    skipResizeObserver
    (resizeChange)="onResized($event)"
    [options]="gaugeOptions"
    [value]="value() ?? 0"
    [attr.value-text]="textValue()"
  ></linear-gauge>
}
