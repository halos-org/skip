name: 'Run Tests'
description: 'Run all CI checks (lint, strictNullChecks ratchet, unit tests) and build the webapp'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
      shell: bash

    - name: Run CI checks
      run: npm run ci
      shell: bash

    - name: Build webapp
      run: npm run build:prod
      shell: bash

    - name: Verify npm package contents
      shell: bash
      # Assert the publish tarball (package.json `files`) contains the built
      # webapp and stays webapp-only — catches a broken files glob, missing build
      # output, or a re-bundled server plugin (plugin/) before a real publish.
      # The Freeboard-SK plugin lives in @halos-org/skip-freeboard-panel now.
      run: |
        files=$(npm pack --dry-run --json \
          | node -e 'const p=JSON.parse(require("fs").readFileSync(0,"utf8"));console.log(p[0].files.map(x=>x.path).join("\n"))')
        echo "$files" | grep -q '^public/' || { echo "::error::npm package missing public/ (webapp build output)"; exit 1; }
        if echo "$files" | grep -q '^plugin/'; then echo "::error::npm package must stay webapp-only but ships plugin/ (re-bundled server plugin?)"; exit 1; fi
        echo "npm package contents verified (webapp-only)"
