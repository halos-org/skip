<div #hWrapper class="canvas-wrap" [style.padding]="frameVisibleView() ? '10px' : '0px'">
  <div class="face">
    <canvas [id]="id() + '-canvas'" style="z-index: inherit;">
      Browser does not support canvas element.
    </canvas>
    @if (showNoData()) {
      <!-- Covers the steelseries face, whose radius is 0.831775 / 2 of the canvas. -->
      <svg class="no-data" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="41.59" />
        <text x="50" y="36" text-anchor="middle">NO DATA</text>
      </svg>
    }
  </div>
</div>
