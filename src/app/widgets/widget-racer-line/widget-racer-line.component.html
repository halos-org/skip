<div class="line-wrapper">
  <div class="filler">
    <canvas #canvasMainRef class="line-canvas"></canvas>
  </div>
  <div class="buttons-container">
    <button mat-flat-button class="button select-button" matTooltip="Select the control mode"
      aria-label="Select the control mode" (click)="toggleMode()"><span class="label label-glyph">&vellip;</span></button>
    @switch (mode()) {
      @case (0) {
        <div class="pin-container"><span class="label label-bias pin">{{ portBiasValue() }}</span></div>
        <div class="len-bias-container"><span class="label label-length"><span class="pin">⚑</span> {{ lineLengthValue() }} <span class="boat">⚑</span></span></div>
        <div class="boat-container"><span class="label label-bias boat">{{ stbBiasValue() }}</span></div>
      }
      @case (1) {
        <button mat-flat-button class="button port-button" matTooltip="Set the port(pin) end of the line to the current position"
          (click)="setLineEnd('port')"><span class="label label-wide">Port End</span></button>
        <button mat-flat-button class="button starboard-button" matTooltip="Set the starboard(boat) end of the line to the current position"
          (click)="setLineEnd('stb')"><span class="label label-wide">Stbd End</span></button>
      }
      @case (2) {
        <!-- Both ends offer the same four adjustments, so a visible label names neither the end it acts
             on nor, for the rotations, a direction at all — only the colour distinguishes them. -->
        <button mat-flat-button class="button port-button" matTooltip="Increase the line length by 5m at the port(pin) end"
          aria-label="Increase the line length by 5m at the port end" (click)="adjustLineEnd('port', 5, 0)"><span class="label">+5m</span></button>
        <button mat-flat-button class="button port-button" matTooltip="Decrease the line length by 5m at the port(pin) end"
          aria-label="Decrease the line length by 5m at the port end" (click)="adjustLineEnd('port', -5, 0)"><span class="label">-5m</span></button>
        <button mat-flat-button class="button starboard-button" matTooltip="Decrease the line length by 5m at the starboard(boat) end"
          aria-label="Decrease the line length by 5m at the starboard end" (click)="adjustLineEnd('stb', -5, 0)"><span class="label">-5m</span></button>
        <button mat-flat-button class="button starboard-button" matTooltip="Increase the line length by 5m at the starboard(boat) end"
          aria-label="Increase the line length by 5m at the starboard end" (click)="adjustLineEnd('stb', 5, 0)"><span class="label">+5m</span></button>
      }
      @case (3) {
        <button mat-flat-button class="button port-button" matTooltip="Rotate the line by moving the port(pin) end 1° clockwise"
          aria-label="Rotate the line by moving the port end 1 degree clockwise" (click)="adjustLineEnd('port', 0, toRadians(1))"><span class="label">↑1°</span></button>
        <button mat-flat-button class="button port-button" matTooltip="Rotate the line by moving the port(pin) end 1° counter-clockwise"
          aria-label="Rotate the line by moving the port end 1 degree counter-clockwise" (click)="adjustLineEnd('port', 0, toRadians(-1))"><span class="label">↓1°</span></button>
        <button mat-flat-button class="button starboard-button" matTooltip="Rotate the line by moving the starboard(boat) end 1° counter-clockwise"
          aria-label="Rotate the line by moving the starboard end 1 degree counter-clockwise" (click)="adjustLineEnd('stb', 0, toRadians(1))"><span class="label">↓1°</span></button>
        <button mat-flat-button class="button starboard-button" matTooltip="Rotate the line by moving the starboard(boat) end 1° clockwise"
          aria-label="Rotate the line by moving the starboard end 1 degree clockwise" (click)="adjustLineEnd('stb', 0, toRadians(-1))"><span class="label">↑1°</span></button>
      }
      @case (4) {
        <button mat-flat-button class="button select-button" matTooltip="Display the next named line"
          (click)="nextDisplayLineName()"><span class="label">Line</span></button>
        <button mat-flat-button class="button {{isDisplayLineCurrent() ? 'line-button-current' : 'line-button'}}"
          matTooltip="Set the {{ getDisplayLineName() }} line as the current line"
          (click)="setStartLine(getDisplayLineName())"><span class="label">{{ getDisplayLineName() }}</span></button>
      }
    }
  </div>
  @if (!dashboard.isDashboardStatic()) {
    <div class="widgetOverlay"></div>
  }
</div>
